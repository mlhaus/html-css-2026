<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Align cross axis</title>
    <link rel="stylesheet" href="main.css">
    <style>
        /* nav menu */
        nav {
            background-color: lightgray;
            margin-bottom: 1em;
        }
        ul {
            display: flex;
            flex-direction: row;
            /* in order to see how the align-items
            property works, you must set a height
            to the flex container */
            align-items: stretch; /* default value, makes child elements the same height as the parent element */
            align-items: flex-start; /* makes child elements align to top */
            align-items: flex-end; /* makes child elements align to bottom */
            align-items: center; /* makes child elements align to center */
            list-style-type: none;
            min-height: 4em;
        }
        li {
            background-color: black;
            /* height: 40px; */
        }
        /* li:hover {
            align-self: stretch;
        } */
        a {
            display: block;
            padding: .5em 1em;
            text-decoration: none;
            color: white; 
        }
    </style>
</head>

<body>
    <h1>Align cross axis</h1>
    <nav>
        <ul id="horizontal">
            <li><a href="#">Home</a></li>
            <li><a href="#">Speakers</a></li>
            <li><a href="#">Get Tickets</a></li>
            <li><a href="#">Become a Member</a></li>
            <li><a href="#">About Us</a></li> 
        </ul>
    </nav>
</body>
</html>
